<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修理管理システム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🔧 生徒用PC 修理管理システム</h1>

    <div class="tabs">
        <button class="tab-button active" onclick="switchTab('tab-board', this)">📋 カンバンボード</button>
        <button class="tab-button" onclick="switchTab('tab-register', this)">➕ 新規受付</button>
        <button class="tab-button" onclick="switchTab('tab-completed', this)">🏁 対応完了履歴</button>
    </div>

    <div id="tab-board" class="tab-content active">
        <div class="board">
            <div class="column"><h3>📝 学内受付</h3><div class="drop-zone" data-status="学内受付" ondragover="allowDrop(event)" ondrop="drop(event)"></div></div>
            <div class="column"><h3>⏳ 修理手配待ち</h3><div class="drop-zone" data-status="修理手配待ち" ondragover="allowDrop(event)" ondrop="drop(event)"></div></div>
            <div class="column"><h3>📦 外部修理中</h3><div class="drop-zone" data-status="外部修理中" ondragover="allowDrop(event)" ondrop="drop(event)"></div></div>
            <div class="column"><h3>🔧 返却準備中</h3><div class="drop-zone" data-status="返却準備中" ondragover="allowDrop(event)" ondrop="drop(event)"></div></div>
            <div class="column"><h3>✅ 返却可能</h3><div class="drop-zone" data-status="返却可能" ondragover="allowDrop(event)" ondrop="drop(event)"></div></div>
        </div>
    </div>

    <div id="tab-register" class="tab-content">
        <div class="form-area">
            <h2 class="form-section-title">生徒情報</h2>
            <div class="form-row">
                <div class="form-group" style="width: 70px;"><label>学年 *</label><input type="text" id="grade" class="req-field" placeholder="例: 5"></div>
                <div class="form-group" style="width: 70px;"><label>組 *</label><input type="text" id="class_num" class="req-field" placeholder="例: D"></div>
                <div class="form-group" style="width: 70px;"><label>番号 *</label><input type="text" id="student_num" class="req-field" placeholder="例: 13"></div>
                <div class="form-group" style="width: 120px;"><label>学籍番号(5桁) *</label><input type="text" id="student_id" class="req-field" placeholder="21119" maxlength="5"></div>
                <div class="form-group" style="flex-grow: 1;"><label>氏名 *</label><input type="text" id="name" class="req-field" placeholder="例: 佐藤 詩恩"></div>
            </div>

            <h2 class="form-section-title">端末・破損状況</h2>
            
            <label style="font-weight: bold; font-size: 0.85em; color: #495057; display: block; margin-bottom: 5px;">修理対象（1つ以上選択） *</label>
            <div class="target-checkboxes" id="repair_targets">
                <label><input type="checkbox" id="repair_pc"> 💻 PC本体</label>
                <label><input type="checkbox" id="repair_kb"> ⌨️ キーボード</label>
                <label><input type="checkbox" id="repair_pen"> 🖊️ タッチペン</label>
            </div>

            <div class="form-row">
                <div class="form-group" style="width: 180px;"><label>PCシリアル (最大14桁)</label><input type="text" id="pc_serial" placeholder="pro7..." maxlength="14"></div>
                <div class="form-group" style="width: 180px;"><label>KBシリアル (最大14桁)</label><input type="text" id="kb_serial" placeholder="..." maxlength="14"></div>
                <div class="form-group" style="flex-grow: 1;">
                    <label>破損状況（分類） *</label>
                    <select id="damage_category" class="req-field">
                        <option value="">選択してください</option>
                        <option value="液晶破損">液晶破損</option>
                        <option value="データ異常">データ異常</option>
                        <option value="接続不良">接続不良</option>
                        <option value="浸水">浸水</option>
                        <option value="接続部変形">接続部変形</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
            </div>

            <div class="form-row" style="flex-grow: 1; flex-direction: column; gap: 5px;">
                <div class="form-group" style="height: 100%; display: flex; flex-direction: column;">
                    <label>具体的な症状・メモ *</label>
                    <textarea id="damage_details" class="req-field" placeholder="例: 画面右上が割れている。"></textarea>
                </div>
            </div>
            
            <button class="btn-submit" onclick="createTicket()">伝票を登録してボードへ追加</button>
        </div>
    </div>

    <div id="tab-completed" class="tab-content">
        <div id="completed-list" class="completed-grid"></div>
    </div>

    <div id="ticket-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
